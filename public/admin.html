<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Panel Casa W — Disponibilidad</title>
<link rel="stylesheet" href="/css/calendar.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Montserrat:wght@400;500;600;700&display=swap');

  :root{
    --bg: #FAF6F1;
    --card: #FFFFFF;
    --ink: #2E251C;
    --muted: #8A7C6E;
    --line: #E6DBCB;
    --gold: #B8935A;
    --gold-deep: #7C5C30;
    --gold-soft: #EFE1C8;
    --olive: #74845F;
    --olive-soft: #E3E8DA;
    --shadow: 0 2px 4px rgba(46,37,28,.06), 0 14px 34px rgba(46,37,28,.10);
  }
  *{ box-sizing: border-box; }
  body{
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Montserrat', ui-sans-serif, system-ui, sans-serif;
    line-height: 1.6;
  }
  h1,h2{ font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; margin: 0; }
  .eyebrow{ font-size: 12px; letter-spacing: .18em; text-transform: uppercase; font-weight: 600; }

  .admin-topbar{
    display:flex; align-items:center; justify-content:space-between; padding: 20px 28px;
    border-bottom: 1px solid var(--line); background: var(--card);
  }
  .admin-topbar a{ font-family:'Cormorant Garamond',serif; font-size:20px; font-weight:600; color:var(--ink); text-decoration:none; }
  .admin-topbar span{ font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:700; }

  .admin-main{ max-width: 620px; margin: 0 auto; padding: 56px 24px 80px; }
  .admin-head{ margin-bottom: 30px; }
  .admin-head p.eyebrow{ color: var(--gold-deep); margin-bottom: 10px; }
  .admin-head h1{ font-size: clamp(26px,4vw,32px); margin-bottom: 10px; }
  .admin-head p{ color: var(--muted); font-size: 14px; max-width: 48ch; }
</style>
</head>
<body>

<div class="admin-topbar">
  <a href="/">Casa W</a>
  <span>Panel interno</span>
</div>

<main class="admin-main">
  <div class="admin-head">
    <p class="eyebrow">Disponibilidad</p>
    <h1>Marcar fechas ocupadas</h1>
    <p>Ingresa con la contraseña del equipo para marcar o liberar fechas. Los cambios se ven al instante en el calendario público de la web.</p>
  </div>
  <div id="cal-admin"></div>
</main>

<script src="/js/calendar.js"></script>
<script>initAvailabilityCalendar("#cal-admin", { autoOpenAdmin: true });</script>
</body>
</html>
